<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d" />
      <stop offset="35%" stop-color="#121316" />
      <stop offset="70%" stop-color="#18191e" />
      <stop offset="100%" stop-color="#22232a" />
    </linearGradient>

    <linearGradient id="darkWaveGrad1" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#050507" />
      <stop offset="40%" stop-color="#15161b" />
      <stop offset="85%" stop-color="#282932" />
      <stop offset="100%" stop-color="#111215" />
    </linearGradient>

    <linearGradient id="darkWaveGrad2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#1f2026" />
      <stop offset="30%" stop-color="#2c2d36" />
      <stop offset="65%" stop-color="#18191f" />
      <stop offset="100%" stop-color="#0c0d10" />
    </linearGradient>

    <linearGradient id="silverWaveGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#3a3c46" />
      <stop offset="25%" stop-color="#676b78" />
      <stop offset="60%" stop-color="#9ea3b2" />
      <stop offset="85%" stop-color="#c6cbd7" />
      <stop offset="100%" stop-color="#8c909e" />
    </linearGradient>

    <linearGradient id="lightWaveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3a7b5" />
      <stop offset="30%" stop-color="#d4d7e2" />
      <stop offset="60%" stop-color="#f0f2f7" />
      <stop offset="90%" stop-color="#e1e4ed" />
      <stop offset="100%" stop-color="#b6bac7" />
    </linearGradient>

    <linearGradient id="whiteDuneGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f4f5f8" />
      <stop offset="75%" stop-color="#e2e4ec" />
      <stop offset="100%" stop-color="#ccd0dc" />
    </linearGradient>

    <linearGradient id="whiteDuneGrad2" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8f9fc" />
      <stop offset="100%" stop-color="#dee0ea" />
    </linearGradient>

    <!-- Filters for smooth depth -->
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="gentleShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="2400" fill="url(#bgGrad)" />

  <!-- Ambient Light Blobs in background -->
  <ellipse cx="250" cy="400" rx="300" ry="250" fill="#1e2029" filter="url(#subtleGlow)" opacity="0.6" />
  <ellipse cx="900" cy="1100" rx="400" ry="300" fill="#434757" filter="url(#subtleGlow)" opacity="0.3" />

  <!-- Top Dark Flowing Dune (Upper Left) -->
  <path d="M 0,0 
           L 700,0 
           C 650,220 540,460 380,560 
           C 240,650 90,690 0,720 
           Z" 
        fill="url(#darkWaveGrad1)" />

  <!-- Upper Mid Transition Wave -->
  <path d="M 1200,300 
           C 950,420 720,540 500,720 
           C 320,860 160,1020 0,1180 
           L 0,900 
           C 180,780 380,640 580,500 
           C 800,340 1020,240 1200,180 
           Z" 
        fill="url(#darkWaveGrad2)" 
        opacity="0.85" />

  <!-- Main Diagonal Deep Sculpted Wave with Shadow -->
  <path d="M 0,980 
           C 220,900 480,880 720,960 
           C 940,1030 1100,1150 1200,1260 
           L 1200,1580 
           C 1050,1460 880,1380 660,1350 
           C 420,1320 200,1370 0,1460 
           Z" 
        fill="url(#silverWaveGrad)" 
        filter="url(#softShadow)" />

  <!-- Elegant Silver-Grey Fluid Mid Dune -->
  <path d="M 0,1360 
           C 240,1260 520,1240 780,1310 
           C 980,1360 1120,1450 1200,1540 
           L 1200,1860 
           C 1040,1740 850,1660 620,1640 
           C 380,1620 160,1690 0,1790 
           Z" 
        fill="url(#lightWaveGrad1)" 
        filter="url(#softShadow)" />

  <!-- Lower Pearl Wave Sweeping Left to Right -->
  <path d="M 0,1720 
           C 220,1620 480,1590 730,1650 
           C 940,1700 1080,1790 1200,1880 
           L 1200,2400 
           L 0,2400 
           Z" 
        fill="url(#whiteDuneGrad)" 
        filter="url(#gentleShadow)" />

  <!-- Pure White Sculpted Foreground Dune (Bottom Center & Right) -->
  <path d="M 0,2050 
           C 180,1960 420,1920 660,1970 
           C 880,2020 1060,2130 1200,2220 
           L 1200,2400 
           L 0,2400 
           Z" 
        fill="url(#whiteDuneGrad2)" 
        filter="url(#gentleShadow)" />

  <!-- Delicate Highlight Edge Reflection on the dunes -->
  <path d="M 0,1720 
           C 220,1620 480,1590 730,1650 
           C 940,1700 1080,1790 1200,1880" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.65)" 
        stroke-width="3" 
        opacity="0.8" />

  <path d="M 0,2050 
           C 180,1960 420,1920 660,1970 
           C 880,2020 1060,2130 1200,2220" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.9)" 
        stroke-width="2.5" 
        opacity="0.9" />
</svg>
